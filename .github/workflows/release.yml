name: Release

# Publishing a GitHub release is what starts a release. The version is already
# on main by then, and the release's tag names it, so this workflow only has to
# check the tagged tree and publish it. Nothing here writes to the repository:
# the publish is irreversible and comes last, so a failed release leaves npm
# untouched and is recovered by deleting the release and its tag.
on:
  release:
    types: [published]

# id-token: write mints the OIDC token npm trusted publishing authenticates
# with, in place of a stored token.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The setup through `npm ci` duplicates .github/workflows/checks.yml.
      # Keep the two in sync, so a release checks what CI checks.
      - uses: actions/checkout@v4

      # lts/* carries an npm new enough for trusted publishing, which needs
      # 11.5.1 or later. Pinning an older Node would break the publish.
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          cache: npm

      # Catches a release cut before the version bump reached main, which is
      # otherwise only caught by npm rejecting a duplicate version.
      - name: Check the tag names the version being published
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "The release is tagged $TAG, but package.json names $VERSION."
            echo "Nothing has been published."
            exit 1
          fi

      # Do not pin. These checks must agree with the validator developers run.
      # A pin would pass on a validator nobody uses.
      - run: npm install --global @anthropic-ai/claude-code

      # This job never commits, so skip the pre-commit hook's install.
      - run: npm ci --ignore-scripts
      - run: npm run check

      - run: npm publish --provenance
