name: Release

on:
  workflow_dispatch:
    inputs:
      level:
        description: How much churn this release asks of consuming projects
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

# contents: write pushes the bump commit and the tag. id-token: write mints the
# OIDC token npm trusted publishing authenticates with, in place of a stored one.
permissions:
  contents: write
  id-token: write

# Two dispatches would compute the same version and race to publish it.
concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A dispatch can name any branch, and releasing from one would publish
      # that tree. This catches the accident rather than a deliberate dispatch:
      # the workflow file itself comes from the ref being dispatched.
      - name: Refuse to release from anywhere but main
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "Releases run from main. This dispatch named $REF."
          exit 1

      - uses: actions/checkout@v4

      # lts/* carries npm 11, over the 11.5.1 trusted publishing needs.
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          cache: npm

      # Do not pin. These checks must agree with the validator developers run.
      # A pin would pass on a validator nobody uses.
      - run: npm install --global @anthropic-ai/claude-code

      # --ignore-scripts leaves the tracked pre-commit hook uninstalled, so it
      # cannot fire on the commit this job makes.
      - run: npm ci --ignore-scripts

      - name: Move the version
        id: bump
        env:
          LEVEL: ${{ inputs.level }}
        run: |
          node scripts/set-version.mjs "$LEVEL"
          npm install --package-lock-only --ignore-scripts
          VERSION="$(node -p 'require("./package.json").version')"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # After the bump, so the checks run on the tree being released. This is
      # the only full check that tree ever gets: the push below uses
      # GITHUB_TOKEN, which starts no workflow, so checks.yml never sees it.
      - run: npm run check

      - name: Commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release $VERSION" package.json package-lock.json .claude-plugin/plugin.json
          git tag -a "v$VERSION" -m "v$VERSION"

      # A publish can be neither undone nor repeated, so refuse one whose commit
      # could not then be pushed. The checkout is shallow and nothing has re-read
      # origin since, so main advancing during the run would only surface after
      # the irreversible step.
      - name: Check main has not moved
        run: |
          git fetch --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"

      - run: npm publish --provenance

      - name: Push main and the tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git push origin HEAD:main
          git push origin "v$VERSION"
