name: Release

# Nothing may be added after the publish: it can be neither undone nor retried.
# Nothing here may write to the repository either — GITHUB_TOKEN cannot push to
# main past its required check, so a release arrives already bumped.
on:
  release:
    types: [published]

permissions:
  contents: read
  # Mints the OIDC token npm trusted publishing authenticates with, in place
  # of a stored token.
  id-token: write

# One release at a time. Publishes that overlap can leave npm's `latest`
# pointing at whichever finished last rather than at the higher version.
concurrency: release

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, so the ancestry check below can reach origin/main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # checkout, setup-node, the CLI install and `npm ci` duplicate
      # .github/workflows/checks.yml. Keep them in sync, so a release checks
      # what CI checks. Two differences are deliberate and load-bearing:
      # fetch-depth above, which the ancestry check needs, and registry-url
      # below, which the publish needs.
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          cache: npm

      # A release can target any commit, so without this one cut from a side
      # branch would publish that tree as `latest`.
      - name: Check the release commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "This release does not point at a commit on main."
            echo "Nothing has been published."
            exit 1
          fi

      # Catches a release cut before the version bump reached main, which npm
      # would otherwise catch only by rejecting a duplicate version.
      - name: Check the tag names the version being published
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "This release is tagged $TAG, but package.json names $VERSION."
            echo "Nothing has been published."
            exit 1
          fi

      # Do not pin. These checks must agree with the validator developers run.
      # A pin would pass on a validator nobody uses.
      - run: npm install --global @anthropic-ai/claude-code

      # `npm publish` runs prepare and installs the hook regardless. Skipping
      # it here keeps the install itself from doing so.
      - run: npm ci --ignore-scripts
      - run: npm run check

      - run: npm publish --provenance
